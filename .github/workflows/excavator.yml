on:
  workflow_dispatch:
  schedule:
    # run every 15 minutes (offset by 5 to dodge top-of-hour congestion)
    - cron: '5,20,35,50 * * * *'
name: Excavator
concurrency:
  group: excavator
  cancel-in-progress: false
jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
